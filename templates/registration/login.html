{% extends "base.html" %}
{% block title %}Đăng nhập | NutriSnack{% endblock %}
{% block content %}
<h1>Đăng nhập</h1>
<form method="post" class="form narrow">
  {% csrf_token %}
  {% include "_form_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary" type="submit">Đăng nhập</button>
</form>
<p>Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký</a>. Bạn vẫn có thể đặt hàng mà không cần tài khoản.</p>
{% endblock %}
